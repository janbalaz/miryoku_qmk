name: Build Latest Miryoku for Cheapino v2
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout Miryoku QMK (The Source of Truth)
        uses: actions/checkout@v4
        with:
          repository: manna-harbour/miryoku_qmk
          ref: miryoku

      - name: Inject Cheapino v2 Hardware Files
        run: |
          # Download hardware definitions from Tompi's dedicated Miryoku branch
          curl -L https://github.com/tompi/qmk_firmware/archive/refs/heads/cheapinov2-miryoku.tar.gz | tar xz --strip-components=2 -C keyboards qmk_firmware-cheapinov2-miryoku/keyboards/cheapino
          # Clean up any legacy layout files that might conflict
          rm -rf keyboards/cheapino/keymaps/manna-harbour_miryoku

      - name: Patch info.json for Modern QMK Compatibility
        run: |
          # Direct inline injection to satisfy modern QMK validation checks
          python3 -c "import json; f=open('keyboards/cheapino/info.json','r+'); d=json.load(f); d['matrix_size']={'rows':16,'cols':16}; f.seek(0); json.dump(d,f); f.truncate()"

      - name: Install QMK Python Dependencies
        run: |
          /opt/uv/tools/qmk/bin/python3 -m pip install -r requirements.txt

      - name: Compile Firmware
        run: |
          git config --global --add safe.directory '*'
          qmk compile -kb cheapino -km manna-harbour_miryoku -e MIRYOKU_ALPHAS=COLEMAKDH -e MIRYOKU_EXTRA=COLEMAKDH -e MIRYOKU_CLIPBOARD=MAC

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cheapino_miryoku_latest
          path: .build/*.uf2
