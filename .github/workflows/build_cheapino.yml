name: Build Latest Miryoku for Cheapino v2
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - name: Checkout Miryoku QMK (The Source of Truth)
        uses: actions/checkout@v4
        with:
          repository: manna-harbour/miryoku_qmk
          ref: miryoku

      - name: Inject Cheapino v2 Hardware Files
        run: |
          # Download hardware definitions from Tompi's dedicated Miryoku branch
          curl -L https://github.com/tompi/qmk_firmware/archive/refs/heads/cheapinov2-miryoku.tar.gz | tar xz --strip-components=2 -C keyboards qmk_firmware-cheapinov2-miryoku/keyboards/cheapino
          # Clean up any legacy layout files that might conflict
          rm -rf keyboards/cheapino/keymaps/manna-harbour_miryoku

      - name: Patch Hardware Definitions for Modern QMK
        run: |
          # Dynamically match matrix_size to the exact hardware pins and define the status RGB
          python3 -c "
          import json
          with open('keyboards/cheapino/info.json', 'r+') as f:
              d = json.load(f)
              matrix_pins = d.get('matrix_pins', {})
              rows = len(matrix_pins.get('rows', [0]*4))
              cols = len(matrix_pins.get('cols', [0]*12))
              d['matrix_size'] = {'rows': rows, 'cols': cols}
              if 'rgblight' not in d: d['rgblight'] = {}
              d['rgblight']['led_count'] = 1
              f.seek(0)
              json.dump(d, f)
              f.truncate()
          "
          # Safely append the LED count and map it to the physical internal pin (GP16) of the RP2040-Zero
          printf "\n#define RGBLED_NUM 1\n#define RGB_DI_PIN GP16\n" >> keyboards/cheapino/config.h

      - name: Install QMK Python Dependencies
        run: |
          /opt/uv/tools/qmk/bin/python3 -m pip install -r requirements.txt

      - name: Compile Firmware
        run: |
          git config --global --add safe.directory '*'
          qmk compile -kb cheapino -km manna-harbour_miryoku -e MIRYOKU_ALPHAS=COLEMAKDH -e MIRYOKU_EXTRA=COLEMAKDH -e MIRYOKU_CLIPBOARD=MAC

      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: cheapino_miryoku_latest
          path: "*.uf2"
